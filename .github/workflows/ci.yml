# Integración continua del backend (SPEC-11 §5.1, plan §7.1).
# Sin secretos del repositorio (RN-P04): todo valor es de prueba y vive sólo en el job.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Migraciones y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        # Base efímera del job: se destruye al terminar.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: prestamedios_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d prestamedios_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Ciclo de migraciones sobre una base y tests sobre otra (P9.2: PostgreSQL real).
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/prestamedios_ci
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/prestamedios_test
      EMAIL_BACKEND: memoria

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Secreto JWT de prueba
        run: |
          clave="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$clave"
          echo "JWT_SECRET_KEY=$clave" >> "$GITHUB_ENV"

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      - name: Una sola cabeza de Alembic
        run: |
          alembic heads
          test "$(alembic heads | wc -l)" -eq 1 || { echo "::error::Hay más de una cabeza de Alembic: la migración nueva debe colgar de la cabeza vigente (regla de C19)."; exit 1; }

      - name: Migraciones reversibles (upgrade → downgrade base → upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q -p no:cacheprovider

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Etapa final (producción)
        run: docker build --target final -t prestamedios-api:ci .
      - name: Etapa dev
        run: docker build --target dev -t prestamedios-api:ci-dev .
